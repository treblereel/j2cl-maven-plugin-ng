name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
      id: setup-chrome

    - name: Set up ChromeDriver
      uses: nanasess/setup-chromedriver@v3

    - name: Build plugin
      run: mvn -B install -pl plugin -DskipTests

    - name: Run tests
      run: mvn -B package -pl tests -Dcheckstyle.skip
      env:
        DISPLAY: ':99'

    - name: Run checkstyle
      run: mvn -B checkstyle:check
