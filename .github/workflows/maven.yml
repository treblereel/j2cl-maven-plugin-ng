name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, development ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
      id: setup-chrome

    - name: Set up ChromeDriver
      uses: nanasess/setup-chromedriver@v3

    - name: Set up Binaryen
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux) platform=linux ;;
          macOS) platform=macos ;;
          Windows) platform=windows ;;
        esac
        arch=x86_64
        if [ "$RUNNER_ARCH" = ARM64 ]; then arch=arm64; fi
        binaryen_dir="$RUNNER_TEMP"
        if [ "$RUNNER_OS" = Windows ]; then binaryen_dir=$(cygpath -u "$binaryen_dir"); fi
        curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-${arch}-${platform}.tar.gz" -o "$binaryen_dir/binaryen.tar.gz"
        # Read from stdin so GNU tar does not treat a Windows drive letter as a remote host.
        tar -xzf - -C "$binaryen_dir" < "$binaryen_dir/binaryen.tar.gz"
        echo "$RUNNER_TEMP/binaryen-version_125/bin" >> "$GITHUB_PATH"

    - name: Check Binaryen
      run: wasm-opt --version

    - name: Build plugin
      run: mvn -B install -pl plugin

    - name: Run tests
      run: mvn -B -f tests/pom.xml package "-Dcheckstyle.skip"
      env:
        DISPLAY: ':99'

    - name: Build localized bundle sample
      run: mvn -B -f samples/single-module/pom.xml package "-Dcheckstyle.skip"

    - name: Check published JS and WASM in Chrome
      run: mvn -B -pl plugin test -Dtest=BuildOutputIntegrationTest -Dj2cl.integration=true "-Dcheckstyle.skip"

  checkstyle:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run checkstyle
      run: mvn -B checkstyle:check
